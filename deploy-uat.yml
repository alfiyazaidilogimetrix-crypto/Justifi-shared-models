name: Deploy Shared Models to UAT

on:
  push:
    branches:
      - uat

jobs:
  deploy-uat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shared-models
        uses: actions/checkout@v4

      - name: Deploy to UAT server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e

            SHARED_MODELS_COMMIT="${{ github.sha }}"

            echo "Deploying shared-models commit: $SHARED_MODELS_COMMIT"

            cd /opt/justifi/Justifi-shared-models
            git fetch origin uat
            git checkout uat
            git reset --hard "$SHARED_MODELS_COMMIT"

            SERVICES=(
              "justifi-auth-onboarding"
              "justifi-backend"
              "justifi-cases-management"
              "justifi-calling-service"
              "justifi-chat-service"
              "justifi-dms-service"
            )

            for SERVICE in "${SERVICES[@]}"; do
              echo "========================================"
              echo "Updating $SERVICE"
              echo "========================================"

              cd "/opt/justifi/$SERVICE"

              npm install "github:alfiyazaidilogimetrix-crypto/Justifi-shared-models#$SHARED_MODELS_COMMIT"

              echo "Updated $SERVICE"
            done

            cd /opt/justifi

            echo "========================================"
            echo "Rebuilding UAT services"
            echo "========================================"

            docker compose build \
              justifi-auth-onboarding \
              justifi-backend \
              justifi-cases-management \
              justifi-calling-service \
              justifi-chat-service \
              justifi-dms-service

            echo "========================================"
            echo "Starting UAT services"
            echo "========================================"

            docker compose up -d \
              justifi-auth-onboarding \
              justifi-backend \
              justifi-cases-management \
              justifi-calling-service \
              justifi-chat-service \
              justifi-dms-service

            echo "========================================"
            echo "UAT deployment completed"
            echo "Shared models commit: $SHARED_MODELS_COMMIT"
            echo "========================================"
