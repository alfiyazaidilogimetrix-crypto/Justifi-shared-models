```yaml
name: Deploy Shared Models to UAT

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH secrets
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "EC2_SSH_KEY is EMPTY or NOT AVAILABLE"
            exit 1
          fi

          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST is EMPTY or NOT AVAILABLE"
            exit 1
          fi

          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "EC2_USER is EMPTY or NOT AVAILABLE"
            exit 1
          fi

          echo "All SSH secrets are available"

      - name: Deploy to UAT
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            SHARED_MODELS_COMMIT="${{ github.sha }}"

            echo "Deploying commit: $SHARED_MODELS_COMMIT"

            cd /opt/justifi/justifi-auth-onboarding
            npm install "github:alfiyazaidilogimetrix-crypto/Justifi-shared-models#$SHARED_MODELS_COMMIT"

            cd /opt/justifi/justifi-backend
            npm install "github:alfiyazaidilogimetrix-crypto/Justifi-shared-models#$SHARED_MODELS_COMMIT"

            cd /opt/justifi/justifi-cases-management
            npm install "github:alfiyazaidilogimetrix-crypto/Justifi-shared-models#$SHARED_MODELS_COMMIT"

            cd /opt/justifi/justifi-calling-service
            npm install "github:alfiyazaidilogimetrix-crypto/Justifi-shared-models#$SHARED_MODELS_COMMIT"

            cd /opt/justifi/justifi-chat-service
            npm install "github:alfiyazaidilogimetrix-crypto/Justifi-shared-models#$SHARED_MODELS_COMMIT"

            cd /opt/justifi/justifi-dms-service
            npm install "github:alfiyazaidilogimetrix-crypto/Justifi-shared-models#$SHARED_MODELS_COMMIT"

            cd /opt/justifi

            docker compose build \
              justifi-auth-onboarding \
              justifi-backend \
              justifi-cases-management \
              justifi-calling-service \
              justifi-chat-service \
              justifi-dms-service

            docker compose up -d \
              justifi-auth-onboarding \
              justifi-backend \
              justifi-cases-management \
              justifi-calling-service \
              justifi-chat-service \
              justifi-dms-service

            echo "UAT deployment completed successfully"
```
