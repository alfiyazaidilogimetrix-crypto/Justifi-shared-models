name: Deploy Shared Models to UAT

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH secret
        run: |
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "EC2_SSH_KEY is EMPTY or NOT AVAILABLE"
            exit 1
          else
            echo "EC2_SSH_KEY is available"
          fi

          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST is EMPTY or NOT AVAILABLE"
            exit 1
          else
            echo "EC2_HOST is available"
          fi

          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "EC2_USER is EMPTY or NOT AVAILABLE"
            exit 1
          else
            echo "EC2_USER is available"
          fi

      - name: Deploy to UAT
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            SHARED_MODELS_COMMIT="${{ github.sha }}"

            echo "Deploying shared-models commit: $SHARED_MODELS_COMMIT"

            SERVICES="
            justifi-auth-onboarding
            justifi-backend
            justifi-cases-management
            justifi-calling-service
            justifi-chat-service
            justifi-dms-service
            "

            for SERVICE in $SERVICES; do
              echo "========================================"
              echo "Updating $SERVICE"
              echo "========================================"

              cd "/opt/justifi/$SERVICE"

              npm install "github:alfiyazaidilogimetrix-crypto/Justifi-shared-models#$SHARED_MODELS_COMMIT"
            done

            cd /opt/justifi

            echo "========================================"
            echo "Building UAT containers"
            echo "========================================"

            docker compose build \
              justifi-auth-onboarding \
              justifi-backend \
              justifi-cases-management \
              justifi-calling-service \
              justifi-chat-service \
              justifi-dms-service

            echo "========================================"
            echo "Restarting UAT containers"
            echo "========================================"

            docker compose up -d \
              justifi-auth-onboarding \
              justifi-backend \
              justifi-cases-management \
              justifi-calling-service \
              justifi-chat-service \
              justifi-dms-service

            echo "========================================"
            echo "UAT deployment completed"
            echo "Shared Models Commit: $SHARED_MODELS_COMMIT"
            echo "========================================"
```
